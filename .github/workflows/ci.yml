name: agent-runtime-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax check
        run: python -m py_compile agent.py context.py state.py checkpoint.py evidence.py observability.py evals.py macro_sources.py macro_analysis.py macro_multisource_analysis.py api_sources.py native_http.py api_sources_native.py r2_api_planner.py r2_api_tooling.py r2_api_evals.py r3_decomposition.py r3_synthesis.py r3_planner.py r3_tooling.py r3_evals.py r4_source_health.py source_smoke.py r5_quality.py r5_evals.py planner.py scheduler.py tools.py policy.py model_validation.py model_adapters.py run_real.py serve_visualizer.py test_agent.py test_state.py test_checkpoint.py test_evidence.py test_observability_evals.py test_macro_research.py test_r2_api_only.py test_native_http.py test_r3_research_intelligence.py test_r4_source_health.py test_r5_quality.py test_planner_scheduler.py test_visualizer.py
      - name: Browser JavaScript syntax check
        run: node --check web/app.js && node --check web/r1_app.js && node --check web/r2_api_app.js && node --check web/r3_app.js && node --check web/r4_health.js && node --check web/r5_quality.js
      - name: Unit tests
        run: python -m unittest -v
