name: agent-runtime-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax check
        run: python -m py_compile agent.py context.py state.py checkpoint.py evidence.py observability.py evals.py planner.py scheduler.py tools.py policy.py model_validation.py model_adapters.py run_real.py serve_visualizer.py test_agent.py test_state.py test_checkpoint.py test_evidence.py test_observability_evals.py test_planner_scheduler.py test_visualizer.py
      - name: Browser JavaScript syntax check
        run: node --check web/app.js
      - name: Unit tests
        run: python -m unittest -v
