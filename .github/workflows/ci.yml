name: agent-runtime-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax check
        run: python -m py_compile agent.py context.py state.py checkpoint.py evidence.py observability.py evals.py macro_sources.py macro_analysis.py macro_multisource_analysis.py api_sources.py native_http.py api_sources_native.py r2_api_planner.py r2_api_tooling.py r2_api_evals.py r3_decomposition.py r3_synthesis.py r3_planner.py r3_tooling.py r3_evals.py r4_source_health.py source_smoke.py r5_quality.py r5_evals.py r6_domain.py r6_planner.py r6_tooling.py r6_evals.py r7_forecast.py r7_planner.py r7_tooling.py r7_evals.py r7_checkpoint.py r7_streaming.py r8_decision.py r8_planner.py r8_tooling.py r8_evals.py r8_eval_current.py r9_market.py r9_planner.py r9_tooling.py r9_evals.py r10_investment.py r10_instrument.py r10_planner.py r10_tooling.py r10_evals.py r11_portfolio.py r11_tooling.py r12_strategy.py r12_event_sources.py r12_identity.py r12_rules.py r12_execution.py r12_discovery.py r12_registry.py r12_tooling.py r12_agent.py r12_paper.py r12_portfolio.py planner.py scheduler.py tools.py policy.py model_validation.py model_adapters.py run_real.py serve_visualizer.py serve_r8.py serve_r9.py serve_r10.py serve_r11.py serve_r12.py test_agent.py test_state.py test_checkpoint.py test_evidence.py test_observability_evals.py test_macro_research.py test_r2_api_only.py test_native_http.py test_r3_research_intelligence.py test_r4_source_health.py test_r5_quality.py test_r6_domain_synthesis.py test_r7_forecast.py test_r7_checkpoint.py test_r7_streaming.py test_r8_decision_lenses.py test_r8_integration.py test_r9_market_pricing.py test_r9_market_alignment.py test_r9_eval_http.py test_r9_ui_contract.py test_r10_investment.py test_r10_instrument.py test_r10_integration.py test_r10_ev_http.py test_r10_instrument_http.py test_r10_ui_contract.py test_r11_portfolio.py test_r11_http.py test_r11_ui_contract.py test_r12_strategy.py test_r12_event_sources.py test_r12_identity.py test_r12_rules.py test_r12_execution.py test_r12_agent.py test_r12_paper.py test_r12_portfolio.py test_r12_discovery.py test_r12_http.py test_r12_step2_http.py test_r12_step3_http.py test_r12_step4_http.py test_r12_step5_http.py test_r12_ui_contract.py test_r12_step2_ui_contract.py test_r12_step3_ui_contract.py test_r12_step4_ui_contract.py test_r12_step5_ui_contract.py test_r12_step6_ui_contract.py test_r12_step7_ui_contract.py test_ui_v3_stream_contract.py test_planner_scheduler.py test_visualizer.py
      - name: Browser JavaScript syntax check
        run: node --check web/app.js && node --check web/r1_app.js && node --check web/r2_api_app.js && node --check web/r3_app.js && node --check web/r4_health.js && node --check web/r5_quality.js && node --check web/r6_app.js && node --check web/r7_app.js && node --check web/r7_v3.js && node --check web/r7_v3_stream.js && node --check web/r7_v3_stream_polish.js && node --check web/r8_ui.js && node --check web/r8_eval_current.js && node --check web/r9_ui.js && node --check web/r10_ui.js && node --check web/r10_step2.js && node --check web/r10_step3.js && node --check web/r11_ui.js && node --check web/r12_ui.js && node --check web/r12_step2.js && node --check web/r12_step3.js && node --check web/r12_step4.js && node --check web/r12_step5.js && node --check web/r12_step6.js && node --check web/r12_step7.js
      - name: Unit tests
        run: python -m unittest -v
